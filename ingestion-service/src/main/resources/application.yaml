server:
  port: 8081

spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  application:
    name: ingestion-service
  datasource:
    url: jdbc:mysql://localhost:3309/ingestion_db
    username: ${DB_USERNAME:CHANGE_ME}
    password: ${DB_PASSWORD:CHANGE_ME}
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema, Hibernate just validates
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

camel:
  springboot:
    main-run-controller: true