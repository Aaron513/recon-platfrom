server:
  port: 8082

spring:
  application:
    name: reconciliation-service
  datasource:
    url: jdbc:mysql://localhost:3309/reconciliation_db
    username: root
    password: root@123
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: reconciliation-service
      auto-offset-reset: earliest
      max-poll-records: 10
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.reconplatform.common.dto.TransactionDTO
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.reconplatform.common.dto
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: com.reconplatform.reconciliation_service.serialization.TransactionDtoJsonSerializer