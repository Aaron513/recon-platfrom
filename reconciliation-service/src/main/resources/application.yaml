server:
  port: 8082

spring:
  application:
    name: reconciliation-service
  datasource:
    url: jdbc:mysql://localhost:3309/reconciliation_db
    username: root
    password: root@123
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: reconciliation-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.reconplatform.common.dto.TransactionDTO
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.reconplatform.common.dto
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer