server:
  port: 8083

jwt:
  secret: "BzHTVldnTK2TTmAped5TdKTkX4g+lyfqho7vLoxF9OU="
  expiration-minutes: 60

spring:
  application:
    name: review-service
  datasource:
    url: jdbc:mysql://localhost:3309/review_db
    username: root
    password: root@123
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: review-service
      auto-offset-reset: earliest
      max-poll-records: 10
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.reconplatform.common.dto.TransactionDTO
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.reconplatform.common.dto
  activemq:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin
  jms:
    pub-sub-domain: false   # queues, matching the point-to-point command design