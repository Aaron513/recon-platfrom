server:
  port: 8083

jwt:
  secret: ${JWT_SECRET:CHANGE_ME_BASE64_32_BYTE_KEY}
  expiration-minutes: 60

spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  application:
    name: review-service
  datasource:
    url: jdbc:mysql://localhost:3309/review_db
    username: ${DB_USERNAME:CHANGE_ME}
    password: ${DB_PASSWORD:CHANGE_ME}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    placeholders:
      reviewer_user_id: ${REVIEWER_USER_ID:CHANGE_ME}
      reviewer_username: ${REVIEWER_USERNAME:CHANGE_ME}
      reviewer_password_hash: ${REVIEWER_PASSWORD_HASH:CHANGE_ME}
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: review-service
      auto-offset-reset: earliest
      max-poll-records: 10
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.reconplatform.common.dto.TransactionDTO
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.reconplatform.common.dto
  activemq:
    broker-url: tcp://localhost:61616
    user: ${ACTIVEMQ_USERNAME:CHANGE_ME}
    password: ${ACTIVEMQ_PASSWORD:CHANGE_ME}
  jms:
    pub-sub-domain: false   # queues, matching the point-to-point command design